<ul class="term-list">
  {% for s in stats %}
  {% set url = "/terms?sel=" ~ (s.term.key | urlencode) %}
  <li class="{{ 'active' if s.term.key == sel }} {{ 'unused' if not s.n }}">
    <a href="{{ url }}" hx-get="/terms/detail?key={{ s.term.key | urlencode }}" hx-target="#detail"
       hx-push-url="{{ url }}" onclick="markActive(this)">
      <span class="en">{{ s.term.en }}</span>
      <span class="num">{% if s.n %}{{ s.inconsistent }}/{{ s.n }}{% else %}未出現{% endif %}</span>
      <span class="zh">{{ s.term.ok | join(" / ") or "（未定）" }}</span>
      {% if s.n %}<span class="meter"><span style="width: {{ (s.consistency * 100) | round }}%"></span></span>{% endif %}
    </a>
  </li>
  {% else %}
  <li class="empty">沒有符合的詞彙</li>
  {% endfor %}
</ul>
