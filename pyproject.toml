[project]
name = "kc-tc"
version = "0.1.0"
description = "Keycloak 繁體中文（zh_Hant）翻譯工具：從 Hosted Weblate 下載、檢查詞彙一致性與用語"
readme = "README.md"
authors = [
    { name = "allen0099", email = "s96016641@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.scripts]
kc-tc = "kc_tc:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
